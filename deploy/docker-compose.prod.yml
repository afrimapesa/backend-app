# Production / preview stack on a single server.
#
#   cd deploy && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Expects the frontend repo checked out next to this one (FRONTEND_DIR, default
# ../../frontend-app). Only Caddy is reachable from outside (ports 80/443).
name: afrimapesa

# Settings shared by every Django container (api, worker, beat, sampler).
x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.prod}
  DATABASE_URL: postgres://afrimapesa:${POSTGRES_PASSWORD}@db:5432/afrimapesa
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: INFO
  # Live mid-market FX feeds: each runs only when its key is set (see .env.prod.example).
  OPEN_EXCHANGE_RATES_APP_ID: ${OPEN_EXCHANGE_RATES_APP_ID:-}
  EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
  EXCHANGE_RATE_API_BASE: ${EXCHANGE_RATE_API_BASE:-EUR}
  CURRENCY_FREAKS_API_KEY: ${CURRENCY_FREAKS_API_KEY:-}
  CURRENCY_FREAKS_BASE: ${CURRENCY_FREAKS_BASE:-GBP}
  FX_REFRESH_MINUTES: ${FX_REFRESH_MINUTES:-60}
  FX_MID_MAX_AGE_MINUTES: ${FX_MID_MAX_AGE_MINUTES:-30}

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: afrimapesa
      POSTGRES_USER: afrimapesa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrimapesa -d afrimapesa"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ..
    restart: unless-stopped
    environment:
      <<: *django-env
      # "api" lets the frontend container call Django over the internal network.
      DJANGO_ALLOWED_HOSTS: ${DOMAIN},api,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Scheduled ingestion: beat queues the FX feeds every FX_REFRESH_MINUTES, the worker runs
  # them. Every run is logged in the ingestion_runs table (Django admin > Ingestion runs).
  worker:
    build: ..
    restart: unless-stopped
    command:
      - sh
      - -c
      - until python manage.py migrate --check >/dev/null 2>&1; do sleep 5; done;
        exec celery -A config worker -l info --concurrency 2
    environment: *django-env
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }

  beat:
    build: ..
    restart: unless-stopped
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    environment: *django-env
    depends_on:
      - worker

  # PREVIEW ONLY: keeps labelled sample rates and quotes fresh (every 5 min) until the live
  # FX feed and provider adapters run. Once an FX feed key is set, set
  # SAMPLER_FLAGS=--quotes-only so only sample provider quotes are written, priced on the
  # live rates. Remove this service and run `seed_sample_quotes --clear` when the provider
  # adapters run too.
  sampler:
    build: ..
    restart: unless-stopped
    # Wait until the api container has applied migrations, then refresh every 5 minutes.
    command:
      - sh
      - -c
      - until python manage.py migrate --check >/dev/null 2>&1; do sleep 5; done;
        exec python manage.py seed_sample_quotes --loop 300 ${SAMPLER_FLAGS:-}
    environment: *django-env
    depends_on:
      api: { condition: service_started }

  web:
    build:
      context: ${FRONTEND_DIR:-../../frontend-app}
      args:
        # Same origin as the site: Caddy routes /v1/* to Django, so no CORS is needed.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_TIKTOK_URL: ${NEXT_PUBLIC_TIKTOK_URL:-}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
    restart: unless-stopped
    environment:
      # Server-side rendering talks to Django directly inside the Docker network.
      API_URL: http://api:8000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      PREVIEW_USER: ${PREVIEW_USER:?set PREVIEW_USER in .env.prod}
      PREVIEW_PASSWORD_HASH: ${PREVIEW_PASSWORD_HASH:?set PREVIEW_PASSWORD_HASH in .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
